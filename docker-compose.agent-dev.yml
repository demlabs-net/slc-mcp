name: demlabs-slc-mcp

services:
  slc-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: demlabs/slc-mcp:local
    container_name: dev-swarm-slc-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "2002:3000"
    env_file:
      - .env
    environment:
      SLC_VAULT_PATH: /data/vault
    volumes:
      - "${SLC_VAULT_HOST_PATH:?set SLC_VAULT_HOST_PATH in .env}:/data/vault"
      - "./secrets/slc-vault-ed25519:/home/slc/.ssh/id_ed25519:ro"
      - "./secrets/forgejo-known-hosts:/home/slc/.ssh/known_hosts:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      swarm:
        aliases: [slc-mcp]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  swarm:
    external: true
    name: demlabs-dev-swarm
