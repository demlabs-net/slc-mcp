# SLC MCP — HTTPS reverse proxy for local MCP clients (SSE + POST).
#
# Install: place into /etc/nginx/sites-available/slc (extend), or copy to
# /etc/nginx/sites-available/slc-https and symlink into sites-enabled.
# Certificate: deploy/nginx/gen-cert.sh.
#
# Endpoints:
#   https://127.0.0.1:8443/mcp      — JSON-RPC POST (MCP Streamable HTTP)
#   https://127.0.0.1:8443/sse      — SSE (event: endpoint → POST /messages)
#   https://127.0.0.1:8443/messages — SSE messages
#   https://127.0.0.1:8443/health   — healthcheck
#
# SSE requirements: proxy_buffering off, HTTP/1.1 to the upstream, Connection '',
# long proxy_read_timeout (the server sends keep-alives every 15s).

server {
    listen 0.0.0.0:8080;
    server_name slc.local localhost 192.168.0.251;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
        gzip off;
    }
}

server {
    listen 0.0.0.0:8443 ssl;
    http2 on;
    server_name slc.local localhost 192.168.0.251;

    ssl_certificate     /etc/nginx/ssl/slc/slc-mcp.crt;
    ssl_certificate_key /etc/nginx/ssl/slc/slc-mcp.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE / streamable HTTP: без буферизации, кэша и сжатия.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
        gzip off;
    }
}
