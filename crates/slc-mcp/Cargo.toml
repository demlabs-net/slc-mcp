[package]
name = "slc-mcp"
description = "SLC MCP — standalone memory server binary: MCP (JSON-RPC over HTTP) + CLI over the slc-core engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.deb]
maintainer = "DemLabs <dev@demlabs.net>"
copyright = "2026 DemLabs"
depends = "ca-certificates"
section = "net"
priority = "optional"
extended-description = """SLC MCP: MCP (JSON-RPC /mcp, SSE /sse) + REST + SPA web UI in one process."""
assets = [
  ["target/release/slc-mcp", "usr/local/bin/", "755"],
  ["webui/**/*", "usr/share/slc-mcp/webui/", "644"],
]

[[bin]]
name = "slc-mcp"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
axum = { version = "0.8", features = ["json", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
bcrypt = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
slc-core = { workspace = true }

[dev-dependencies]
slc-core = { workspace = true }
