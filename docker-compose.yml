# SLC MCP — сервер памяти (Obsidian vault) + веб-морда (slc-webui).
#
# Vault location on the host comes from $SLC_VAULT (set by deploy.sh,
# default ~/Obsidian/slc-vault). LM Studio / Ollama on the host are
# reachable via host.docker.internal.
services:
  slc-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: slc-mcp:local
    container_name: slc-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      SLC_VAULT_PATH: /data/vault
    volumes:
      - "${SLC_VAULT_HOST_PATH:?run deploy.sh (sets SLC_VAULT_HOST_PATH)}:/data/vault"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Веб-морда: REST поверх встроенного движка + статика SPA (порт 3002).
  # Открывает тот же vault (multi-process синк через refresh).
  slc-webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    image: slc-webui:local
    container_name: slc-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    env_file:
      - .env
    environment:
      SLC_VAULT_PATH: /data/vault
      SLC_WEBUI_DIST: /app/dist
    volumes:
      - "${SLC_VAULT_HOST_PATH:?run deploy.sh (sets SLC_VAULT_HOST_PATH)}:/data/vault"
    depends_on:
      - slc-mcp
