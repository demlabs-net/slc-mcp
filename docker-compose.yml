# SLC MCP — memory server (Obsidian vault) + web UI, one process.
# MCP (JSON-RPC /mcp, SSE /sse, /messages) + REST /api/* + SPA static —
# all on port 3000; a single vault owner means no access conflicts.
#
# Vault location on the host comes from $SLC_VAULT (set by deploy.sh,
# default ~/Obsidian/slc-vault). LM Studio / Ollama on the host are
# reachable via host.docker.internal.
services:
  slc-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: slc-mcp:local
    container_name: slc-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      SLC_VAULT_PATH: /data/vault
    volumes:
      - "${SLC_VAULT_HOST_PATH:?run deploy.sh (sets SLC_VAULT_HOST_PATH)}:/data/vault"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # LM Studio живёт на atlant-llm0 (AWG-адрес 10.0.44.6, слушает 0.0.0.0:1234).
      # В docker-DNS имени нет, без записи LMSTUDIO_URL=http://atlant-llm0:1234 из
      # контейнера не резолвится (NXDOMAIN) и эмбеддинги SLC молча деградируют.
      - "atlant-llm0:10.0.44.6"
