# SLC MCP — сервер памяти (Obsidian vault) + веб-морда, один процесс.
# MCP (JSON-RPC /mcp, SSE /sse, /messages) + REST /api/* + SPA-статика —
# всё на порту 3000; владелец vault один, конфликтов доступа нет.
#
# Vault location on the host comes from $SLC_VAULT (set by deploy.sh,
# default ~/Obsidian/slc-vault). LM Studio / Ollama on the host are
# reachable via host.docker.internal.
services:
  slc-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: slc-mcp:local
    container_name: slc-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      SLC_VAULT_PATH: /data/vault
    volumes:
      - "${SLC_VAULT_HOST_PATH:?run deploy.sh (sets SLC_VAULT_HOST_PATH)}:/data/vault"
    extra_hosts:
      - "host.docker.internal:host-gateway"
